version: "2"
issues:
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
linters:
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: gotest.tools/assert
              desc: use gotest.tools/v3/assert instead
    govet:
      enable-all: true
      disable:
        - fieldalignment
    errorlint:
      errorf: true
      asserts: true
      comparison: true
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - depguard
    - errcheck
    - errorlint
    - exhaustive
    - gochecknoinits
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - prealloc
    - predeclared
    - revive
    - staticcheck
    - tparallel
    - unconvert
    - unparam
    - unused
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - funlen
          - gosec
          - govet
          - unparam
